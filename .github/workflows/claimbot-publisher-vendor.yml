name: Compile ClaimBot publisher bundle once
on:
  push:
    branches: [feature/claimbot-arkiv-wallet-publisher]
    paths: ['.github/workflows/claimbot-publisher-vendor.yml']
permissions: {contents: write}
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix claimbot-x402 --no-audit --no-fund
          npm run build:publisher --prefix claimbot-x402
      - name: Commit updated publisher bundle
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add claimbot-x402/src/publisherBundle.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update configured Arkiv wallet bundle"
          git push origin "HEAD:refs/heads/feature/claimbot-arkiv-wallet-publisher"
