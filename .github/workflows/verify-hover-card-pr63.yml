name: Verify Hover Card dependency update
on:
  push:
    branches:
      - renovate/radix-ui-react-hover-card-1.x-lockfile
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm check
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build
